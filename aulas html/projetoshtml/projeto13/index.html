<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/clock.ico">
    <title>Dias Vividos</title>

    <style>
        #resultado,
        #classifica {
            display: block;
            font-size: clamp(12px, 3vw, 18px);
            color: #9c3912;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>Dias Vividos</h2>

    <p>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome">
    </p>

    <p>
        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Digite a idade atual">
    </p>

    <button onclick="calcular()" title="Calcular a quantidade de dias vividos">
        Calcular
    </button>

    <button onclick="fechar()" title="Fechar essa página">
        Fechar
    </button>

    <div id="resultado"></div>

    <div id="classifica"></div>

    <script>

        function calcular() {

            let nome = document.getElementById("nome").value;

            let idade = Number(document.getElementById("idade").value);

            let diasVividos = Math.round(idade * 365.2425);

            let resultadoDiv = document.getElementById("resultado");

            resultadoDiv.innerHTML = `
                <p>
                    <b>Olá ${nome}</b>, você viveu aproximadamente:
                    <b>${diasVividos} dias</b>
                </p>
            `;

            let mensagem;

            if (idade <= 17) {
                mensagem = "Aprendiz";
            } else if (idade <= 25) {
                mensagem = "Estagiário";
            } else {
                mensagem = "Profissional";
            }
            console.log(mensagem);
            document.getElementById("classifica").textContent = mensagem;
            document.getElementById("classifica").style.color = "#9c3912";
        }
        function fechar() {
            window.close();
        }
    </script>

    <p>
        Aluno: Henrique Gomes Soares<br>
        Matrícula: 291087668
    </p>

</body>

</html>
