<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
/* 1. Reset básico (sem o max-width aqui) */
        * {
            margin: 0;
            padding: 0;
        
        }

        /* 2. Centraliza tudo no meio da tela (opcional, mas fica com visual melhor) */
        body {
            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center;     /* Centraliza verticalmente */       /* Ocupa a altura toda da tela */
            background-color: #121212; /* Fundo escuro para destacar a luminária */
        }

        /* 3. Limita o tamanho máximo apenas do container da imagem */
        figure {
             
            width: 100%; /* Garante que não vaze da tela no celular */
            padding: 20px; /* Um respiro nas laterais */
        }
        /* 4. Faz a imagem se adaptar ao tamanho da figure */
        img {
            width: 100%; 
            height: auto; /* Mantém a proporção da imagem sem distorcer */
            border-radius: 10px; /* Deixa as bordas levemente arredondadas */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Sombrinha para dar destaque */
        }
</style>
<header><a href=""></a></header>
<body>
    <figure><img src="./image/Início.png" alt=""></figure>x
    <div></div>
    
</body>
</html>
